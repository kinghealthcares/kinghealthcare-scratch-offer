<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎁 Magic Scratch Offer - King Healthcare</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      text-align: center;
    }
    h2 {
      padding: 20px;
      font-size: 24px;
      color: gold;
    }
    .container {
      position: relative;
      max-width: 380px;
      margin: 20px auto;
      border: 2px solid #fff;
      border-radius: 15px;
      box-shadow: 0 0 20px #ffd70088;
      overflow: hidden;
      background: #111;
    }
    #offer-img {
      width: 100%;
      border-radius: 10px;
      display: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 10px;
      cursor: pointer;
    }
    #popup {
      display: none;
      background: #fff;
      color: #000;
      padding: 20px;
      border-radius: 10px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px #ffbf00;
      z-index: 999;
    }
    #popup button {
      margin-top: 15px;
      padding: 12px 24px;
      background: #28a745;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>🎉 स्क्रैच करें और अपना हेल्थ गिफ्ट पाएं 🎁</h2>
  <div class="container">
    <img id="offer-img" src="https://i.imgur.com/NUZ5N7X.png" alt="Offer Image"/>
    <canvas id="scratch" width="380" height="240"></canvas>
  </div>

  <div id="popup">
    <h3>🎉 बधाई हो!</h3>
    <p>आपने <strong>Free Home Sample Collection</strong> जीत लिया है।</p>
    <button onclick="saveContact()">सेव करें और WhatsApp करें</button>
  </div>

  <script>
    const canvas = document.getElementById('scratch');
    const ctx = canvas.getContext('2d');
    const offerImg = document.getElementById('offer-img');
    const popup = document.getElementById('popup');
    let isDrawing = false;

    function drawDot(x, y) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 20, 0, 2 * Math.PI);
      ctx.fill();
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      drawDot(e.offsetX, e.offsetY);
    });
    canvas.addEventListener('mousemove', (e) => {
      if (isDrawing) drawDot(e.offsetX, e.offsetY);
    });
    canvas.addEventListener('mouseup', () => {
      isDrawing = false;
      checkReveal();
    });

    canvas.addEventListener('touchstart', (e) => {
      isDrawing = true;
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      drawDot(touch.clientX - rect.left, touch.clientY - rect.top);
    });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (isDrawing) {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        drawDot(touch.clientX - rect.left, touch.clientY - rect.top);
      }
    });
    canvas.addEventListener('touchend', () => {
      isDrawing = false;
      checkReveal();
    });

    function checkReveal() {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let cleared = 0;
      for (let i = 3; i < imageData.data.length; i += 4) {
        if (imageData.data[i] === 0) cleared++;
      }
      if (cleared / (canvas.width * canvas.height) > 0.4) {
        canvas.style.display = 'none';
        offerImg.style.display = 'block';
        setTimeout(() => popup.style.display = 'block', 500);
      }
    }

    function saveContact() {
      const vCardData = `BEGIN:VCARD\nVERSION:3.0\nFN:Pathology King Health Cares\nTEL;TYPE=CELL:6306215287\nEMAIL:kinghealthcare.ltd@gmail.com\nEND:VCARD`;
      const blob = new Blob([vCardData], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'king_healthcare.vcf';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        window.open("https://wa.me/916306215287?text=" + encodeURIComponent("नमस्ते,\nमैंने King HealthCare का Scratch Card ऑफर जीता है। कृपया मेरा सैंपल कलेक्शन करें।"), '_blank');
      }, 1000);
    }

    window.onload = () => {
      ctx.fillStyle = '#aaaaaa';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    };
  </script>
</body>
</html>
