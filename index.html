<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>King Healthcare Scratch Offer</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #000000, #2c3e50);
      color: #fff;
      text-align: center;
    }
    .container {
      position: relative;
      max-width: 400px;
      margin: 50px auto;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 12px;
    }
    #offer-img {
      width: 100%;
      display: none;
      border-radius: 12px;
    }
    h2 {
      font-size: 24px;
      margin-top: 30px;
      color: #f1c40f;
      text-shadow: 1px 1px 3px #000;
    }
    #popup {
      display: none;
      background: #ffffff;
      color: #000;
      padding: 20px;
      border-radius: 12px;
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px #00ffcc;
      z-index: 10;
      width: 80%;
      max-width: 320px;
    }
    #popup p {
      margin-bottom: 10px;
      font-size: 16px;
    }
    #popup button {
      padding: 12px 20px;
      background: #27ae60;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>🎉 स्क्रैच करें और अपना गिफ्ट पाएं 🎁</h2>
  <div class="container">
    <img id="offer-img" src="jeeet.png" alt="Offer Image" />
    <canvas id="scratch" width="400" height="300"></canvas>
  </div>

  <div id="popup">
    <p>🎉 बधाई हो! आपने जीता: <strong>Free Home Sample Collection</strong> 🏠🧪</p>
    <button onclick="saveContact()">सेव करें और WhatsApp करें</button>
  </div>

  <script>
    const canvas = document.getElementById('scratch');
    const ctx = canvas.getContext('2d');
    const offerImg = document.getElementById('offer-img');
    const popup = document.getElementById('popup');

    let isDrawing = false;

    function getTouchPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.touches[0].clientX - rect.left,
        y: e.touches[0].clientY - rect.top
      };
    }

    function drawDot(x, y) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 20, 0, Math.PI * 2);
      ctx.fill();
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      drawDot(e.offsetX, e.offsetY);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDrawing) drawDot(e.offsetX, e.offsetY);
    });

    canvas.addEventListener('mouseup', () => {
      isDrawing = false;
      checkReveal();
    });

    canvas.addEventListener('touchstart', (e) => {
      isDrawing = true;
      const pos = getTouchPos(e);
      drawDot(pos.x, pos.y);
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (isDrawing) {
        const pos = getTouchPos(e);
        drawDot(pos.x, pos.y);
      }
    });

    canvas.addEventListener('touchend', () => {
      isDrawing = false;
      checkReveal();
    });

    function checkReveal() {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let cleared = 0;
      for (let i = 0; i < imageData.data.length; i += 4) {
        if (imageData.data[i + 3] === 0) {
          cleared++;
        }
      }
      if (cleared / (canvas.width * canvas.height) > 0.4) {
        canvas.style.display = 'none';
        offerImg.style.display = 'block';
        setTimeout(() => {
          popup.style.display = 'block';
        }, 500);
      }
    }

    function saveContact() {
      const vCardData = `BEGIN:VCARD\nVERSION:3.0\nFN:Pathology King Health Cares\nTEL;TYPE=CELL:6306215287\nEMAIL:kinghealthcare.ltd@gmail.com\nEND:VCARD`;

      const blob = new Blob([vCardData], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'king_technician.vcf';
      document.body.appendChild(a);
      a.click();

      setTimeout(() => {
        window.open("https://wa.me/916306215287?text=" + encodeURIComponent("नमस्ते,\nमैंने स्क्रैच ऑफर देखा है। कृपया मेरा सैंपल कलेक्शन करें।\nधन्यवाद!"), '_blank');
      }, 1000);
    }

    // Load grey scratch area
    window.onload = () => {
      ctx.fillStyle = '#cccccc'; // light grey scratch area
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#555';
      ctx.font = '20px sans-serif';
      ctx.fillText('🎁 यहां स्क्रैच करें 🎁', 100, 150);
    };
  </script>
</body>
</html>
