<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>King Healthcare Scratch Offer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      text-align: center;
    }

    h2 {
      padding-top: 30px;
      font-size: 26px;
    }

    .container {
      position: relative;
      width: 300px;
      height: 200px;
      margin: 40px auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }

    #reward {
      width: 100%;
      height: 100%;
      background: #ffe600;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      background: #999;
    }

    #popup {
      display: none;
      background: white;
      color: black;
      padding: 20px;
      border-radius: 10px;
      width: 80%;
      max-width: 320px;
      margin: 30px auto;
      box-shadow: 0 0 10px #fff;
    }

    #popup button {
      margin-top: 15px;
      padding: 10px 20px;
      background: green;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>🎁 स्क्रैच करके गिफ्ट पाएं 🎁</h2>

  <div class="container">
    <div id="reward">🎉 बधाई हो! आप फ्री होम सैंपल कलेक्शन जीत चुके हैं! 🎉</div>
    <canvas id="scratch" width="300" height="200"></canvas>
  </div>

  <div id="popup">
    <p>अब आप टेक्नीशियन से संपर्क कर सकते हैं:</p>
    <button onclick="contactNow()">सेव करें और WhatsApp पर बात करें</button>
  </div>

  <script>
    const canvas = document.getElementById('scratch');
    const ctx = canvas.getContext('2d');
    const popup = document.getElementById('popup');

    let isDrawing = false;

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      scratch(e.offsetX, e.offsetY);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDrawing) scratch(e.offsetX, e.offsetY);
    });

    canvas.addEventListener('mouseup', () => {
      isDrawing = false;
      checkScratched();
    });

    canvas.addEventListener('touchstart', (e) => {
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      const x = e.touches[0].clientX - rect.left;
      const y = e.touches[0].clientY - rect.top;
      scratch(x, y);
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (isDrawing) {
        const rect = canvas.getBoundingClientRect();
        const x = e.touches[0].clientX - rect.left;
        const y = e.touches[0].clientY - rect.top;
        scratch(x, y);
      }
    });

    canvas.addEventListener('touchend', () => {
      isDrawing = false;
      checkScratched();
    });

    function scratch(x, y) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 20, 0, 2 * Math.PI);
      ctx.fill();
    }

    function checkScratched() {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let transparentPixels = 0;
      for (let i = 3; i < imgData.data.length; i += 4) {
        if (imgData.data[i] === 0) transparentPixels++;
      }
      const scratchedPercent = transparentPixels / (canvas.width * canvas.height) * 100;
      if (scratchedPercent > 40) {
        canvas.style.display = 'none';
        popup.style.display = 'block';
      }
    }

    function contactNow() {
      const vCard = `BEGIN:VCARD\nVERSION:3.0\nFN:King Health Cares\nTEL:6306215287\nEMAIL:kinghealthcare.ltd@gmail.com\nEND:VCARD`;
      const blob = new Blob([vCard], { type: 'text/vcard' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'king_health_cares.vcf';
      document.body.appendChild(link);
      link.click();
      setTimeout(() => {
        window.open("https://wa.me/916306215287?text=" + encodeURIComponent("नमस्ते, मैंने King Healthcare स्क्रैच ऑफर जीता है। कृपया सैंपल कलेक्ट करें। धन्यवाद!"), "_blank");
      }, 1000);
    }

    window.onload = () => {
      ctx.fillStyle = '#999';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    };
  </script>
</body>
</html>
